<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>অ্যাপ আপডেট | Premium Light UI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #0a1128;
      font-family: 'Segoe UI', 'Noto Sans Bengali', 'Hind Siliguri', 'Arial', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Softer dark blue gradient background */
    .background-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 25% 35%, #1e2a5a 0%, #0c1430 60%, #060b1c 100%);
      z-index: 0;
    }

    /* Floating particle canvas */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Main container - elegant glass card */
    .update-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 500px;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 2rem 2.8rem;
      background: rgba(20, 30, 60, 0.3);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 2.8rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(120, 160, 255, 0.18), 0 0 25px rgba(80, 120, 230, 0.2);
      animation: cardFloat 5.5s infinite ease-in-out;
    }

    @keyframes cardFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }

    /* Logo wrapper with soft rotating ring */
    .logo-wrapper {
      position: relative;
      width: 135px;
      height: 135px;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Elegant rotating ring */
    .rotating-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: rgba(110, 160, 255, 0.7);
      border-right-color: rgba(90, 140, 245, 0.55);
      border-bottom-color: rgba(110, 160, 255, 0.5);
      border-left-color: rgba(90, 140, 245, 0.4);
      filter: drop-shadow(0 0 6px rgba(90, 140, 250, 0.5));
      animation: rotateRing 3.5s linear infinite;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Chat app icon */
    .app-icon {
      width: 82px;
      height: 82px;
      background: linear-gradient(140deg, #4a65e5, #6b8cf7);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 28px rgba(80, 130, 245, 0.45), 0 10px 18px rgba(0,0,0,0.45);
      position: relative;
      z-index: 2;
      animation: pulseIcon 2.8s infinite ease-in-out;
    }

    .chat-bubble {
      width: 40px;
      height: 35px;
      background: white;
      border-radius: 19px 19px 19px 6px;
      position: relative;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 6px;
      width: 11px;
      height: 11px;
      background: white;
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }

    .chat-dots {
      display: flex;
      gap: 5px;
      margin-left: 3px;
      margin-bottom: 2px;
    }

    .chat-dots span {
      width: 6px;
      height: 6px;
      background: #4a65e5;
      border-radius: 50%;
      opacity: 0.8;
    }

    @keyframes pulseIcon {
      0% { transform: scale(1); box-shadow: 0 0 22px rgba(80, 130, 245, 0.4), 0 10px 18px rgba(0,0,0,0.45); }
      50% { transform: scale(1.04); box-shadow: 0 0 38px rgba(100, 155, 255, 0.55), 0 14px 22px rgba(0,0,0,0.5); }
      100% { transform: scale(1); box-shadow: 0 0 22px rgba(80, 130, 245, 0.4), 0 10px 18px rgba(0,0,0,0.45); }
    }

    /* Bengali heading */
    .bengali-title {
      font-size: 2.6rem;
      font-weight: 650;
      color: #eef4ff;
      text-shadow: 0 0 14px rgba(100, 155, 255, 0.65), 0 0 28px rgba(80, 130, 245, 0.35);
      letter-spacing: 0.5px;
      margin: 0 0 0.6rem;
      line-height: 1.3;
      font-family: 'Noto Sans Bengali', 'Hind Siliguri', 'Segoe UI', sans-serif;
      animation: fadeInUp 0.9s ease-out;
      word-break: break-word;
    }

    .bengali-subtitle {
      font-size: 1.12rem;
      font-weight: 400;
      color: rgba(215, 225, 255, 0.88);
      text-shadow: 0 0 7px rgba(80, 130, 250, 0.45);
      margin-bottom: 1rem;
      padding: 0 0.4rem;
      line-height: 1.65;
      font-family: 'Noto Sans Bengali', 'Hind Siliguri', sans-serif;
      animation: fadeInUp 1.1s ease-out;
      max-width: 400px;
    }

    /* No loading bar, no dots - clean finish */

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 500px) {
      .update-container {
        padding: 2.4rem 1.5rem 2.2rem;
        border-radius: 2.4rem;
      }
      .bengali-title {
        font-size: 2rem;
      }
      .bengali-subtitle {
        font-size: 0.98rem;
      }
      .logo-wrapper {
        width: 115px;
        height: 115px;
      }
      .app-icon {
        width: 70px;
        height: 70px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="background-layer"></div>
  <canvas id="particleCanvas"></canvas>

  <div class="update-container">
    <!-- Logo with elegant rotating ring -->
    <div class="logo-wrapper">
      <div class="rotating-ring"></div>
      <div class="app-icon">
        <div class="chat-bubble">
          <div class="chat-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bengali content -->
    <h1 class="bengali-title">অ্যাপ আপডেট হচ্ছে</h1>
    <p class="bengali-subtitle">নতুন ফিচার ও উন্নত অভিজ্ঞতা নিয়ে খুব শীঘ্রই ফিরে আসছি...</p>
  </div>

  <script>
    (function() {
      // ---------- Soft floating particles ----------
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];

      const PARTICLE_COUNT = 50;

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }

      class Particle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.radius = Math.random() * 2 + 0.8;
          const choice = Math.random();
          if (choice < 0.65) {
            this.color = 'rgba(150, 185, 255, 0.55)';
          } else if (choice < 0.88) {
            this.color = 'rgba(110, 150, 240, 0.48)';
          } else {
            this.color = 'rgba(185, 205, 255, 0.6)';
          }
          this.speedX = (Math.random() - 0.5) * 0.22;
          this.speedY = (Math.random() - 0.5) * 0.22;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < -8) this.x = width + 8;
          if (this.x > width + 8) this.x = -8;
          if (this.y < -8) this.y = height + 8;
          if (this.y > height + 8) this.y = -8;
        }

        draw(ctx) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowColor = 'rgba(110, 150, 245, 0.45)';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.shadowColor = 'transparent';
        }
      }

      function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(new Particle());
        }
      }

      function drawParticles() {
        ctx.clearRect(0, 0, width, height);
        for (let p of particles) {
          p.update();
          p.draw(ctx);
        }
        requestAnimationFrame(drawParticles);
      }

      window.addEventListener('resize', () => {
        resizeCanvas();
        initParticles();
      });

      resizeCanvas();
      initParticles();
      drawParticles();
    })();
  </script>
</body>
</html>
