<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kotha Bolbo</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#00d4ff" />
  <meta name="description" content="Kotha Bolbo – Talk, stay connected. Created by Sayem." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kotha Bolbo" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

  <!-- OneSignal -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "77ef1a77-de38-410a-809f-c7b640031b2b",
        serviceWorkerParam: { scope: "/" },
        serviceWorkerPath: "OneSignalSDKWorker.js",
        allowLocalhostAsSecureOrigin: false,
        notifyButton: { enable: false },
        promptOptions: {
          native: { enabled: false },
          slidedown: { enabled: false }
        }
      });
      console.log("✅ OneSignal Initialized");
    });
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,500;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-tertiary: #1a2235;
      --bg-card: #151e30;
      --bg-input: #1e2d44;
      --accent: #00d4ff;
      --accent-glow: rgba(0,212,255,0.18);
      --accent-2: #7c3aed;
      --bubble-sent: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      --bubble-recv: #1e2d44;
      --text-primary: #e8f0fe;
      --text-secondary: #8899bb;
      --text-muted: #4a5a78;
      --border: rgba(0,212,255,0.12);
      --shadow: 0 6px 24px rgba(0,0,0,0.4);
      --radius: 14px;
      --radius-sm: 8px;
      --nav-h: 56px;
      --header-h: 52px;
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
      --danger: #ff4d6d;
      --success: #4ade80;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; width:100%; overflow:hidden; font-family:'Inter',sans-serif; background:var(--bg-primary); color:var(--text-primary); font-size: 15px; }

    /* ========== Website Blocker ========== */
    #pwa-block {
      position: fixed; inset:0; z-index:99999;
      background: radial-gradient(ellipse at center, #0f172a 0%, #020617 100%);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px; text-align: center;
    }
    .pwa-block-inner { max-width: 320px; }
    .pwa-block-inner i { font-size: 56px; color: #00d4ff; margin-bottom: 16px; }
    .pwa-block-inner h2 { color: #e8f0fe; margin-bottom: 8px; font-size: 1.3rem; }
    .pwa-block-inner p { color: #8899bb; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .btn-download-app {
      padding: 14px 28px;
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: #000; border: none; border-radius: 10px;
      font-weight: 700; font-size: 16px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,212,255,0.4); transition: 0.2s;
    }
    .btn-download-app:hover { transform: translateY(-2px); }

    /* ========== Splash ========== */
    #splash {
      position: fixed; inset:0; z-index:9998;
      background: radial-gradient(ellipse at center, #0f172a 0%, #020617 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; transition: opacity 0.8s, transform 0.8s;
    }
    #splash.hide { opacity:0; transform:scale(1.08); pointer-events:none; }
    .splash-logo-wrap { position:relative; width:100px; height:100px; display:flex; align-items:center; justify-content:center; }
    .splash-bubble {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      border-radius: 50% 50% 50% 20%;
      display: flex; align-items:center; justify-content:center;
      box-shadow: 0 0 30px rgba(0,212,255,0.5), 0 0 60px rgba(124,58,237,0.3);
      animation: bubble-float 2.4s ease-in-out infinite;
      position: relative; z-index:2;
    }
    .splash-bubble i { font-size: 28px; color: #fff; margin-left: 3px; }
    @keyframes bubble-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .splash-rings {
      position: absolute; top:50%; left:50%; width:100px; height:100px; margin:-50px 0 0 -50px; pointer-events:none;
    }
    .splash-ring {
      position: absolute; border-radius:50%; border:2px solid transparent; top:50%; left:50%;
      animation: ring-spin 3s linear infinite;
    }
    .splash-ring:nth-child(1) { width:100px; height:100px; margin:-50px 0 0 -50px; border-top-color:#00d4ff; animation-duration:2.2s; }
    .splash-ring:nth-child(2) { width:85px; height:85px; margin:-42px 0 0 -42px; border-bottom-color:#7c3aed; animation-duration:2.8s; animation-direction:reverse; }
    .splash-ring:nth-child(3) { width:70px; height:70px; margin:-35px 0 0 -35px; border-top-color:#00d4ff; animation-duration:3.6s; }
    @keyframes ring-spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    .splash-particles {
      position:absolute; width:120px; height:120px; animation:particles-rotate 10s linear infinite;
      top:50%; left:50%; margin:-60px 0 0 -60px; pointer-events:none;
    }
    .splash-particles::before, .splash-particles::after {
      content:''; position:absolute; width:5px; height:5px; border-radius:50%; box-shadow:0 0 10px currentColor;
    }
    .splash-particles::before { top:0; left:50%; margin-left:-2px; background:#00d4ff; color:#00d4ff; }
    .splash-particles::after { bottom:0; left:50%; margin-left:-2px; background:#7c3aed; color:#7c3aed; }
    @keyframes particles-rotate { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    .splash-title {
      font-family:'Exo 2',sans-serif; font-size:2.2rem; font-weight:700;
      background:linear-gradient(135deg,#00d4ff,#7c3aed);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      letter-spacing:3px; filter:drop-shadow(0 0 18px rgba(0,212,255,0.6));
      animation:title-pulse 2.2s infinite alternate; margin-top:6px;
    }
    @keyframes title-pulse {
      from { filter:drop-shadow(0 0 8px rgba(0,212,255,0.5)); }
      to { filter:drop-shadow(0 0 22px rgba(124,58,237,0.8)); }
    }
    .splash-sub { font-size:0.7rem; color:#b0c4de; letter-spacing:3px; text-transform:uppercase; opacity:0.8; animation:fade-sub 2s infinite alternate; }
    @keyframes fade-sub { 0%{opacity:0.4;} 100%{opacity:1;} }

    /* ========== Notification Permission Modal ========== */
    #notification-perm-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #notification-perm-overlay.open { opacity: 1; pointer-events: all; }
    .notif-perm-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 20px 20px;
      width: min(300px, 90vw);
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    #notification-perm-overlay.open .notif-perm-card { transform: scale(1); }
    .notif-perm-icon {
      font-size: 48px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .notif-perm-card h3 { font-size: 1.1rem; margin-bottom: 6px; color: var(--text-primary); }
    .notif-perm-card p { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 20px; }
    .notif-perm-buttons { display: flex; gap: 10px; }
    .notif-perm-buttons button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .btn-allow { background: linear-gradient(135deg,#00d4ff,#0099cc); color: #000; }
    .btn-later { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-secondary); }

    /* ========== Auth ========== */
    .auth-mini-logo {
      width: 50px; height:50px; margin:0 auto 12px;
      background:linear-gradient(135deg,#00d4ff,#7c3aed); border-radius:14px;
      display:flex; align-items:center; justify-content:center;
      animation: bubble-float 2s ease-in-out infinite;
    }
    .auth-mini-logo i { font-size:20px; color:#fff; }
    #auth-screen {
      position:fixed; inset:0; z-index:100; background:var(--bg-primary);
      display:none; flex-direction:column; align-items:center; justify-content:center;
      padding:16px; overflow-y:auto;
    }
    .auth-logo { text-align:center; margin-bottom:24px; }
    .auth-logo h1 { font-family:'Exo 2',sans-serif; font-size:1.6rem; font-weight:700; background:linear-gradient(135deg,#00d4ff,#7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .auth-logo p { font-size:0.7rem; color:var(--text-muted); margin-top:2px; }
    .auth-card { width:100%; max-width:360px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
    .auth-tabs { display:flex; gap:4px; margin-bottom:20px; background:var(--bg-secondary); border-radius:var(--radius-sm); padding:3px; }
    .auth-tab { flex:1; padding:8px; border:none; background:transparent; color:var(--text-secondary); border-radius:6px; cursor:pointer; font-family:inherit; font-size:0.8rem; font-weight:500; transition:var(--transition); }
    .auth-tab.active { background:var(--accent); color:#000; font-weight:600; }
    .form-group { margin-bottom:12px; }
    .form-group label { display:block; font-size:0.7rem; font-weight:600; color:var(--text-secondary); margin-bottom:4px; letter-spacing:0.5px; text-transform:uppercase; }
    .form-group input {
      width:100%; padding:10px 12px; border-radius:var(--radius-sm);
      background:var(--bg-input); border:1.5px solid var(--border); color:var(--text-primary);
      font-family:inherit; font-size:0.85rem; outline:none; transition:var(--transition);
    }
    .btn-primary {
      width:100%; padding:12px; border:none; border-radius:var(--radius-sm);
      background:linear-gradient(135deg,#00d4ff,#0099cc); color:#000;
      font-family:inherit; font-size:0.9rem; font-weight:700; cursor:pointer;
    }
    .auth-error { font-size:0.75rem; color:#ff6b6b; text-align:center; margin-top:10px; min-height:16px; }

    /* ========== App ========== */
    #app { display:none; flex-direction:column; height:100%; width:100%; }
    #app.visible { display:flex; }
    .screen { display:none; flex-direction:column; flex:1; overflow:hidden; }
    .screen.active { display:flex; }
    .app-header {
      height:var(--header-h); background:var(--bg-secondary); border-bottom:1px solid var(--border);
      display:flex; align-items:center; padding:0 12px; gap:10px;
    }
    .header-info { flex:1; }
    .header-info h2 { font-size:0.95rem; font-weight:600; }
    .header-info span { font-size:0.7rem; color:var(--text-secondary); }

    .bottom-nav { height:var(--nav-h); background:var(--bg-secondary); border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-around; }
    .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; border:none; background:transparent; color:var(--text-muted); cursor:pointer; padding:6px 0; }
    .nav-btn i { font-size:18px; }
    .nav-btn span { font-size:0.65rem; }
    .nav-btn.active { color:var(--accent); }
    .nav-btn .badge { position:absolute; top:4px; right:calc(50% - 12px); background:var(--danger); color:#fff; font-size:0.6rem; border-radius:999px; min-width:14px; height:14px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

    .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:12px; padding:32px; }
    .empty-state i { font-size:42px; color:var(--text-muted); }
    .empty-state h3 { font-size:1rem; font-weight:600; color:var(--text-secondary); }

    #toast { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:var(--bg-tertiary); border:1px solid var(--border); color:var(--text-primary); padding:10px 18px; border-radius:999px; font-size:0.8rem; z-index:9997; opacity:0; transition:all 0.3s; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(-10px); }
  </style>
</head>
<body>

<!-- ===== Website Blocker ===== -->
<div id="pwa-block">
  <div class="pwa-block-inner">
    <i class="fas fa-download"></i>
    <h2>Please Download This App</h2>
    <p>To use Kotha Bolbo, install the app on your device from the official store.</p>
    <button class="btn-download-app" onclick="window.location.href='https://sayemwebstore.vercel.app'">Get This App</button>
  </div>
</div>

<!-- ===== Splash ===== -->
<div id="splash" style="display:none;">
  <div class="splash-logo-wrap">
    <div class="splash-rings">
      <div class="splash-ring"></div><div class="splash-ring"></div><div class="splash-ring"></div>
    </div>
    <div class="splash-particles"></div>
    <div class="splash-bubble"><i class="fas fa-comment-dots"></i></div>
  </div>
  <div class="splash-title">Kotha Bolbo</div>
  <div class="splash-sub">Created by Sayem</div>
</div>

<!-- ===== Auth Screen ===== -->
<div id="auth-screen"></div>

<!-- ===== Notification Permission Modal ===== -->
<div id="notification-perm-overlay">
  <div class="notif-perm-card">
    <div class="notif-perm-icon"><i class="fas fa-bell"></i></div>
    <h3>Stay Connected!</h3>
    <p>Turn on notifications to receive messages instantly, even when you're away.</p>
    <div class="notif-perm-buttons">
      <button class="btn-allow" id="btn-notif-allow">Allow</button>
      <button class="btn-later" id="btn-notif-later">Later</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  // ========== FIXED PWA DETECTION ==========
  function isPWA() {
    // Check multiple conditions for PWA detection
    const standalone = window.matchMedia('(display-mode: standalone)').matches;
    const fullscreen = window.matchMedia('(display-mode: fullscreen)').matches;
    const iosStandalone = navigator.standalone;
    const urlParams = new URLSearchParams(window.location.search);
    const pwaParam = urlParams.get('pwa');
    
    return standalone || fullscreen || iosStandalone || pwaParam === 'true';
  }

  // Initial check
  if (!isPWA()) {
    // Not PWA - try to detect after a short delay (some browsers need time)
    setTimeout(() => {
      if (!isPWA()) {
        document.getElementById('pwa-block').style.display = 'flex';
        document.getElementById('splash').style.display = 'none';
        return;
      }
      startApp();
    }, 500);
  } else {
    startApp();
  }

  function startApp() {
    document.getElementById('pwa-block').style.display = 'none';
    document.getElementById('splash').style.display = 'flex';
    setTimeout(() => {
      document.getElementById('splash').classList.add('hide');
      setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        initAuth();
      }, 800);
    }, 3000);
  }

  // ========== Firebase ==========
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, deleteDoc, query, orderBy, onSnapshot, updateDoc, serverTimestamp, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getDatabase, ref, set, onValue, onDisconnect, serverTimestamp as rtdbTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBa2bIHkBNK_oajNeFxgKpz4VrIx1aR5Fo",
    authDomain: "kotha-bolbo-aso.firebaseapp.com",
    projectId: "kotha-bolbo-aso",
    storageBucket: "kotha-bolbo-aso.firebasestorage.app",
    messagingSenderId: "343828860232",
    appId: "1:343828860232:web:b566c74f630f8a2532b77d",
    databaseURL: "https://kotha-bolbo-aso-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const rtdb = getDatabase(app);

  let currentUser = null, currentUserData = null;

  function initAuth() {
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        fetchMyData();
      } else {
        showAuthScreen();
      }
    });
  }

  async function fetchMyData() {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    if (snap.exists()) currentUserData = snap.data();
    else currentUserData = { displayName: 'User', email: currentUser.email, photoURL: '', gender: '' };
    showApp();
  }

  function showApp() {
    document.getElementById('auth-screen').style.display = 'none';
    
    // Build simple UI
    document.body.innerHTML += `
      <div id="app" class="visible">
        <div class="screen active" id="feed-screen">
          <div class="app-header"><div class="header-info"><h2>Feed</h2><span>Updates from your connections</span></div></div>
          <div class="empty-state">
            <i class="fas fa-newspaper" style="font-size:64px;opacity:0.4;"></i>
            <h3>This feature is coming soon</h3>
            <p>Stay tuned for exciting updates!</p>
          </div>
        </div>
        <nav class="bottom-nav">
          <button class="nav-btn active"><i class="fas fa-newspaper"></i><span>Feed</span></button>
          <button class="nav-btn"><i class="fas fa-comment-dots"></i><span>Chats</span></button>
          <button class="nav-btn"><i class="fas fa-users"></i><span>Friends</span></button>
          <button class="nav-btn"><i class="fas fa-cog"></i><span>Settings</span></button>
        </nav>
      </div>
    `;
    
    // Show notification permission modal
    setTimeout(() => {
      if (Notification.permission === 'default') {
        document.getElementById('notification-perm-overlay').classList.add('open');
        document.getElementById('btn-notif-allow').onclick = async () => {
          document.getElementById('notification-perm-overlay').classList.remove('open');
          await Notification.requestPermission();
          showToast('Welcome to Kotha Bolbo!');
        };
        document.getElementById('btn-notif-later').onclick = () => {
          document.getElementById('notification-perm-overlay').classList.remove('open');
          showToast('Welcome to Kotha Bolbo!');
        };
      }
    }, 1000);

    // OneSignal
    OneSignalDeferred.push(async function(OneSignal) {
      const sub = await OneSignal.User.PushSubscription.getCurrent();
      if (sub?.id) {
        await updateDoc(doc(db, 'users', currentUser.uid), { oneSignalPlayerId: sub.id });
      }
    });
  }

  function showAuthScreen() {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('auth-screen').innerHTML = `
      <div class="auth-logo">
        <div class="auth-mini-logo"><i class="fas fa-comment-dots"></i></div>
        <h1>Kotha Bolbo</h1>
        <p>Talk, stay connected</p>
      </div>
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login">Login</button>
          <button class="auth-tab" id="tab-signup">Sign Up</button>
        </div>
        <div id="login-form">
          <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="your@email.com" /></div>
          <div class="form-group"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••" /></div>
          <button class="btn-primary" id="login-btn">Login</button>
        </div>
        <div id="signup-form" style="display:none;">
          <div class="form-group"><label>Full Name</label><input type="text" id="signup-name" placeholder="Your name" /></div>
          <div class="form-group"><label>Email</label><input type="email" id="signup-email" placeholder="your@email.com" /></div>
          <div class="form-group"><label>Password</label><input type="password" id="signup-pass" placeholder="Min 6 characters" /></div>
          <button class="btn-primary" id="signup-btn">Create Account</button>
        </div>
        <div class="auth-error" id="auth-error"></div>
      </div>
    `;

    // Tab switching
    document.getElementById('tab-login').onclick = () => {
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('signup-form').style.display = 'none';
      document.getElementById('tab-login').classList.add('active');
      document.getElementById('tab-signup').classList.remove('active');
    };
    document.getElementById('tab-signup').onclick = () => {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('signup-form').style.display = 'block';
      document.getElementById('tab-signup').classList.add('active');
      document.getElementById('tab-login').classList.remove('active');
    };

    // Login
    document.getElementById('login-btn').onclick = async () => {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch(e) {
        document.getElementById('auth-error').textContent = e.message;
      }
    };

    // Signup
    document.getElementById('signup-btn').onclick = async () => {
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const pass = document.getElementById('signup-pass').value;
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, 'users', cred.user.uid), {
          uid: cred.user.uid,
          displayName: name,
          email: email,
          photoURL: '',
          gender: '',
          createdAt: serverTimestamp()
        });
      } catch(e) {
        document.getElementById('auth-error').textContent = e.message;
      }
    };
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show';
    setTimeout(() => t.className = '', 2500);
  }
</script>
</body>
