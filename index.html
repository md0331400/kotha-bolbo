<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kotha Bolbo</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Exo+2:ital,wght@0,300;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-tertiary: #1a2235;
      --bg-card: #151e30;
      --bg-input: #1e2d44;
      --accent: #00d4ff;
      --accent-glow: rgba(0,212,255,0.18);
      --accent-2: #7c3aed;
      --bubble-sent: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      --bubble-recv: #1e2d44;
      --text-primary: #e8f0fe;
      --text-secondary: #8899bb;
      --text-muted: #4a5a78;
      --border: rgba(0,212,255,0.12);
      --shadow: 0 6px 24px rgba(0,0,0,0.4);
      --radius: 14px;
      --radius-sm: 8px;
      --nav-h: 56px;
      --header-h: 52px;
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
      --danger: #ff4d6d;
      --success: #4ade80;
      --font-sm: 0.8rem;
      --font-md: 0.9rem;
      --font-lg: 1.05rem;
      --font-xl: 1.2rem;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; width:100%; overflow:hidden; font-family:'Hind Siliguri',sans-serif; background:var(--bg-primary); color:var(--text-primary); font-size: 15px; }

    /* ═══════ ORIGINAL SPLASH (সংরক্ষিত, শুধু টাইটেল পরিবর্তিত) ═══════ */
    #splash {
      position: fixed; inset:0; z-index:9999;
      background: radial-gradient(ellipse at center, #0f172a 0%, #020617 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap: 24px; transition: opacity 0.8s cubic-bezier(0.23,1,0.32,1), transform 0.8s cubic-bezier(0.23,1,0.32,1);
    }
    #splash.hide { opacity:0; transform:scale(1.08); pointer-events:none; }
    .splash-logo-wrap { position:relative; width:130px; height:130px; display:flex; align-items:center; justify-content:center; }
    .splash-bubble {
      width: 90px; height: 90px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      border-radius: 50% 50% 50% 20%;
      display: flex; align-items:center; justify-content:center;
      box-shadow: 0 0 40px rgba(0,212,255,0.5), 0 0 80px rgba(124,58,237,0.3);
      animation: bubble-float 2.4s ease-in-out infinite;
      position: relative; z-index:2;
    }
    .splash-bubble i {
      font-size: 36px; color: #fff;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      margin-left: 4px;
    }
    @keyframes bubble-float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .splash-rings {
      position: absolute; top:50%; left:50%; pointer-events:none;
      width: 130px; height: 130px; margin-top:-65px; margin-left:-65px;
    }
    .splash-ring {
      position: absolute; border-radius:50%; border:2px solid transparent;
      top:50%; left:50%; animation: ring-spin 3s linear infinite;
    }
    .splash-ring:nth-child(1) {
      width:130px; height:130px; margin-top:-65px; margin-left:-65px;
      border-top-color:#00d4ff; border-right-color:rgba(0,212,255,0.3);
      animation-duration:2.2s;
    }
    .splash-ring:nth-child(2) {
      width:110px; height:110px; margin-top:-55px; margin-left:-55px;
      border-bottom-color:#7c3aed; border-left-color:rgba(124,58,237,0.3);
      animation-duration:2.8s; animation-direction:reverse;
    }
    .splash-ring:nth-child(3) {
      width:90px; height:90px; margin-top:-45px; margin-left:-45px;
      border-top-color:#00d4ff; border-left-color:rgba(124,58,237,0.4);
      animation-duration:3.6s;
    }
    @keyframes ring-spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .splash-particles {
      position:absolute; width:150px; height:150px; animation: particles-rotate 10s linear infinite;
      top:50%; left:50%; margin-top:-75px; margin-left:-75px; pointer-events:none;
    }
    .splash-particles::before, .splash-particles::after {
      content:''; position:absolute; width:6px; height:6px; border-radius:50%;
      box-shadow:0 0 12px currentColor;
    }
    .splash-particles::before { top:0; left:50%; margin-left:-3px; background:#00d4ff; color:#00d4ff; }
    .splash-particles::after { bottom:0; left:50%; margin-left:-3px; background:#7c3aed; color:#7c3aed; }
    @keyframes particles-rotate { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

    /* টাইটেল – লোগো-স্টাইল */
    .splash-title {
      font-family: 'Exo 2', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 4px;
      filter: drop-shadow(0 0 20px rgba(0,212,255,0.6));
      animation: title-pulse 2.2s ease-in-out infinite alternate;
      margin-top: 8px;
    }
    @keyframes title-pulse {
      from { filter: drop-shadow(0 0 10px rgba(0,212,255,0.5)); }
      to { filter: drop-shadow(0 0 28px rgba(124,58,237,0.8)); }
    }
    .splash-sub {
      font-size: 0.8rem; color:#b0c4de; letter-spacing:4px; text-transform:uppercase;
      opacity:0.8; animation: fade-sub 2s ease-in-out infinite alternate;
    }
    @keyframes fade-sub { 0%{opacity:0.4;} 100%{opacity:1;} }

    /* ═════════════ AUTH/APP ═════════════ */
    .auth-mini-logo {
      width: 50px; height:50px; margin:0 auto 12px;
      background:linear-gradient(135deg,#00d4ff,#7c3aed); border-radius:14px;
      display:flex; align-items:center; justify-content:center;
      animation: bubble-float 2s ease-in-out infinite;
    }
    .auth-mini-logo i { font-size:20px; color:#fff; }

    #auth-screen {
      position:fixed; inset:0; z-index:100; background:var(--bg-primary);
      display:none; flex-direction:column; align-items:center; justify-content:center;
      padding:16px; overflow-y:auto;
    }
    .auth-logo { text-align:center; margin-bottom:24px; }
    .auth-logo h1 { font-family:'Exo 2',sans-serif; font-size:1.6rem; font-weight:700; background:linear-gradient(135deg,#00d4ff,#7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .auth-logo p { font-size:0.7rem; color:var(--text-muted); margin-top:2px; }
    .auth-card { width:100%; max-width:360px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
    .auth-tabs { display:flex; gap:4px; margin-bottom:20px; background:var(--bg-secondary); border-radius:var(--radius-sm); padding:3px; }
    .auth-tab { flex:1; padding:8px; border:none; background:transparent; color:var(--text-secondary); border-radius:6px; cursor:pointer; font-family:inherit; font-size:0.8rem; font-weight:500; transition:var(--transition); }
    .auth-tab.active { background:var(--accent); color:#000; font-weight:600; }
    .form-group { margin-bottom:12px; }
    .form-group label { display:block; font-size:0.7rem; font-weight:600; color:var(--text-secondary); margin-bottom:4px; letter-spacing:0.5px; text-transform:uppercase; }
    .form-group input, .form-group select {
      width:100%; padding:10px 12px; border-radius:var(--radius-sm);
      background:var(--bg-input); border:1.5px solid var(--border); color:var(--text-primary);
      font-family:inherit; font-size:0.85rem; outline:none; transition:var(--transition);
    }
    .form-group select { appearance:none; cursor:pointer; }
    .form-group input:focus, .form-group select:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow); }
    .form-group input::placeholder { color:var(--text-muted); }
    .form-group select option { background:var(--bg-tertiary); color:var(--text-primary); }
    .btn-primary {
      width:100%; padding:12px; border:none; border-radius:var(--radius-sm);
      background:linear-gradient(135deg,#00d4ff,#0099cc); color:#000;
      font-family:inherit; font-size:0.9rem; font-weight:700; cursor:pointer;
      transition:var(--transition); letter-spacing:0.5px;
    }
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,212,255,0.35); }
    .btn-primary:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .btn-danger { width:100%; padding:12px; border:none; border-radius:var(--radius-sm); background:var(--danger); color:#fff; font-size:0.9rem; font-weight:700; cursor:pointer; }
    .btn-secondary { width:100%; padding:12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:transparent; color:var(--text-secondary); font-size:0.9rem; font-weight:600; cursor:pointer; margin-top:6px; }
    .btn-secondary:hover { background:var(--bg-tertiary); }
    .auth-error { font-size:0.75rem; color:#ff6b6b; text-align:center; margin-top:10px; min-height:16px; }

    #app { display:none; flex-direction:column; height:100%; width:100%; position:relative; }
    #app.visible { display:flex; }
    .screen { display:none; flex-direction:column; flex:1; overflow:hidden; animation:fade-in 0.3s ease; }
    .screen.active { display:flex; }
    @keyframes fade-in { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

    .app-header {
      height:var(--header-h); background:var(--bg-secondary); border-bottom:1px solid var(--border);
      display:flex; align-items:center; padding:0 12px; gap:10px; box-shadow:0 2px 12px rgba(0,0,0,0.3);
    }
    .header-avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; border:2px solid var(--accent); flex-shrink:0; cursor:pointer; }
    .header-info { flex:1; min-width:0; cursor:pointer; }
    .header-info h2 { font-size:0.95rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .header-info span { font-size:0.7rem; color:var(--text-secondary); }
    .header-icon-btn { width:32px; height:32px; border:none; background:transparent; color:var(--text-secondary); cursor:pointer; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; transition:var(--transition); }
    .header-icon-btn:hover { background:var(--bg-tertiary); color:var(--accent); }
    .header-back { width:30px; height:30px; border:none; background:transparent; color:var(--accent); cursor:pointer; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; }

    .bottom-nav { height:var(--nav-h); background:var(--bg-secondary); border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-around; box-shadow:0 -4px 16px rgba(0,0,0,0.4); flex-shrink:0; }
    .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:none; background:transparent; color:var(--text-muted); cursor:pointer; padding:6px 0; transition:var(--transition); position:relative; }
    .nav-btn i { font-size:18px; }
    .nav-btn span { font-size:0.65rem; font-weight:500; }
    .nav-btn.active { color:var(--accent); }
    .nav-btn.active i { filter:drop-shadow(0 0 5px var(--accent)); }
    .nav-btn .badge { position:absolute; top:4px; right:calc(50% - 12px); background:var(--danger); color:#fff; font-size:0.6rem; font-weight:700; border-radius:999px; min-width:14px; height:14px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

    .search-bar { padding:8px 12px; background:var(--bg-secondary); border-bottom:1px solid var(--border); flex-shrink:0; }
    .search-bar .search-wrap { display:flex; align-items:center; gap:8px; background:var(--bg-input); border-radius:999px; padding:8px 12px; border:1px solid var(--border); }
    .search-bar input { flex:1; border:none; background:transparent; color:var(--text-primary); font-family:inherit; font-size:0.8rem; outline:none; }
    .search-bar input::placeholder { color:var(--text-muted); }
    .search-bar i { color:var(--text-muted); font-size:13px; }

    #chat-screen .scroll-area { flex:1; overflow-y:auto; }
    .chat-list-item { display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--border); transition:var(--transition); }
    .chat-list-item:hover { background:var(--bg-tertiary); }
    .chat-list-item.unread { background:rgba(0,212,255,0.05); }
    .chat-list-item.unread .chat-preview { font-weight:700; color:var(--text-primary); }
    .chat-avatar { position:relative; flex-shrink:0; }
    .chat-avatar img { width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid var(--border); }
    .status-dot { position:absolute; bottom:1px; right:1px; width:10px; height:10px; border-radius:50%; background:var(--success); border:2px solid var(--bg-secondary); }
    .status-dot.offline { background:var(--text-muted); }
    .chat-info { flex:1; min-width:0; }
    .chat-info-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
    .chat-name { font-size:0.9rem; font-weight:600; }
    .chat-time { font-size:0.65rem; color:var(--text-muted); flex-shrink:0; }
    .chat-preview { font-size:0.75rem; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .unread-badge { background:var(--danger); color:#fff; font-size:0.65rem; font-weight:700; border-radius:999px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 4px; flex-shrink:0; }

    #conv-screen { position:fixed; inset:0; z-index:50; background:var(--bg-primary); display:none; flex-direction:column; transform:translateX(100%); transition:transform 0.3s cubic-bezier(0.4,0,0.2,1); }
    #conv-screen.open { display:flex; transform:translateX(0); }
    .conv-messages { flex:1; overflow-y:auto; padding:12px 8px; display:flex; flex-direction:column; gap:4px; }
    .msg-row { display:flex; align-items:flex-end; gap:6px; animation:msg-in 0.2s ease; }
    @keyframes msg-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .msg-row.sent { flex-direction:row-reverse; }
    .msg-avatar { width:24px; height:24px; border-radius:50%; object-fit:cover; flex-shrink:0; }
    .msg-row.sent .msg-avatar { display:none; }
    .bubble { max-width:75%; padding:8px 12px; border-radius:16px; font-size:0.8rem; line-height:1.4; word-break:break-word; }
    .bubble.sent { background:var(--bubble-sent); color:#000; font-weight:500; border-bottom-right-radius:4px; }
    .bubble.recv { background:var(--bubble-recv); color:var(--text-primary); border:1px solid var(--border); border-bottom-left-radius:4px; }
    .bubble-time { font-size:0.6rem; margin-top:3px; display:block; text-align:right; }
    .bubble.sent .bubble-time { color:rgba(0,0,0,0.5); }
    .bubble.recv .bubble-time { color:var(--text-muted); }
    .msg-status { font-size:0.6rem; margin-left:3px; }
    .msg-status.sent-status { color:var(--text-muted); }
    .msg-status.delivered { color:var(--text-secondary); }
    .msg-status.seen { color:var(--accent); }

    #typing-row { padding:0 8px 6px; display:none; }
    #typing-row .typing-inner { display:flex; align-items:center; gap:6px; }
    #typing-row .typing-inner img { width:24px; height:24px; border-radius:50%; object-fit:cover; }
    .typing-indicator { display:flex; align-items:center; gap:3px; padding:8px 12px; background:var(--bubble-recv); border-radius:16px; border-bottom-left-radius:4px; border:1px solid var(--border); width:fit-content; }
    .typing-dot { width:5px; height:5px; border-radius:50%; background:var(--text-secondary); animation:typing 1.2s ease infinite; }
    .typing-dot:nth-child(2) { animation-delay:0.2s; }
    .typing-dot:nth-child(3) { animation-delay:0.4s; }
    @keyframes typing { 0%,100% { transform:scale(0.6); opacity:0.3; } 50% { transform:scale(1); opacity:1; } }

    .msg-input-area { display:flex; align-items:flex-end; gap:8px; padding:8px 10px; background:var(--bg-secondary); border-top:1px solid var(--border); flex-shrink:0; }
    .msg-input-wrap { flex:1; background:var(--bg-input); border-radius:999px; border:1.5px solid var(--border); display:flex; align-items:center; padding:0 12px; transition:var(--transition); }
    .msg-input-wrap:focus-within { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow); }
    .msg-input-wrap textarea { flex:1; border:none; background:transparent; color:var(--text-primary); font-family:inherit; font-size:0.85rem; outline:none; resize:none; padding:10px 0; max-height:80px; }
    .msg-input-wrap textarea::placeholder { color:var(--text-muted); }
    .send-btn { width:40px; height:40px; border-radius:50%; border:none; background:linear-gradient(135deg,#00d4ff,#0099cc); color:#000; font-size:16px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:var(--transition); }
    .send-btn:hover { transform:scale(1.08); box-shadow:0 4px 14px rgba(0,212,255,0.4); }

    #friends-screen .scroll-area { flex:1; overflow-y:auto; }
    .friend-item { display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--border); transition:var(--transition); }
    .friend-item:hover { background:var(--bg-tertiary); }
    .friend-item img { width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid var(--border); flex-shrink:0; }
    .friend-info { flex:1; min-width:0; }
    .friend-name { font-size:0.9rem; font-weight:600; }
    .friend-email { font-size:0.7rem; color:var(--text-muted); }
    .friend-chat-btn { width:36px; height:36px; border-radius:50%; border:none; background:linear-gradient(135deg,#00d4ff,#0099cc); color:#000; font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:var(--transition); box-shadow:0 3px 10px rgba(0,212,255,0.3); }

    #settings-screen .scroll-area { flex:1; overflow-y:auto; padding-bottom:16px; }
    .settings-profile { display:flex; flex-direction:column; align-items:center; padding:20px 12px 16px; gap:8px; border-bottom:1px solid var(--border); }
    .profile-avatar-wrap { position:relative; cursor:pointer; }
    .profile-avatar-wrap img { width:74px; height:74px; border-radius:50%; object-fit:cover; border:2px solid var(--accent); box-shadow:0 0 16px var(--accent-glow); }
    .avatar-edit-btn { position:absolute; bottom:0; right:0; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#000; border:2px solid var(--bg-secondary); display:flex; align-items:center; justify-content:center; font-size:10px; cursor:pointer; }
    .profile-name { font-size:1.1rem; font-weight:700; }
    .profile-email { font-size:0.7rem; color:var(--text-secondary); }
    .settings-section { padding:12px; }
    .settings-section h3 { font-size:0.7rem; font-weight:700; color:var(--accent); letter-spacing:1.2px; text-transform:uppercase; margin-bottom:8px; }
    .settings-card { background:var(--bg-card); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; }
    .settings-row { display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; transition:var(--transition); }
    .settings-row:last-child { border-bottom:none; }
    .settings-row:hover { background:var(--bg-tertiary); }
    .settings-row-icon { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
    .settings-row-info { flex:1; }
    .settings-row-info strong { display:block; font-size:0.9rem; font-weight:500; }
    .settings-row-info small { font-size:0.7rem; color:var(--text-secondary); }
    .settings-row i.chevron { color:var(--text-muted); }

    .modal-backdrop { position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.8); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:16px; }
    .modal-backdrop.open { display:flex; }
    .modal { background:var(--bg-card); border-radius:var(--radius); border:1px solid var(--border); width:100%; max-width:340px; padding:20px; max-height:80vh; overflow-y:auto; animation:scale-in 0.2s ease; position:relative; }
    @keyframes scale-in { from { transform:scale(0.9); opacity:0; } to { transform:none; opacity:1; } }
    .modal h2 { font-size:1rem; font-weight:700; margin-bottom:16px; text-align:center; }
    .modal .close-btn { position:absolute; top:12px; right:12px; width:28px; height:28px; border:none; background:var(--bg-tertiary); color:var(--text-secondary); border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; }
    .modal .modal-buttons { display:flex; gap:8px; margin-top:16px; }
    .modal .modal-buttons button { flex:1; }
    .confirm-icon { width:50px; height:50px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:22px; }
    .confirm-icon.warning { background:rgba(255,77,109,0.15); color:var(--danger); }
    .confirm-text { text-align:center; font-size:0.8rem; color:var(--text-secondary); line-height:1.5; margin-bottom:6px; }

    .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:12px; padding:32px; }
    .empty-state i { font-size:42px; color:var(--text-muted); }
