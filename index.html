<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kotha Bolbo</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Exo+2:ital,wght@0,300;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-tertiary: #1a2235;
      --bg-card: #151e30;
      --bg-input: #1e2d44;
      --accent: #00d4ff;
      --accent-glow: rgba(0,212,255,0.18);
      --accent-2: #7c3aed;
      --bubble-sent: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      --bubble-recv: #1e2d44;
      --text-primary: #e8f0fe;
      --text-secondary: #8899bb;
      --text-muted: #4a5a78;
      --border: rgba(0,212,255,0.12);
      --shadow: 0 6px 24px rgba(0,0,0,0.4);
      --radius: 14px;
      --radius-sm: 8px;
      --nav-h: 56px;
      --header-h: 52px;
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
      --danger: #ff4d6d;
      --success: #4ade80;
      --font-sm: 0.8rem;
      --font-md: 0.9rem;
      --font-lg: 1.05rem;
      --font-xl: 1.2rem;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; width:100%; overflow:hidden; font-family:'Hind Siliguri',sans-serif; background:var(--bg-primary); color:var(--text-primary); font-size: 15px; }

    /* ═══════ SPLASH ═══════ */
    #splash {
      position: fixed; inset:0; z-index:9999;
      background: radial-gradient(ellipse at center, #0f172a 0%, #020617 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap: 20px; transition: opacity 0.8s cubic-bezier(0.23,1,0.32,1), transform 0.8s cubic-bezier(0.23,1,0.32,1);
    }
    #splash.hide { opacity:0; transform:scale(1.08); pointer-events:none; }
    .splash-logo-wrap { position:relative; width:100px; height:100px; display:flex; align-items:center; justify-content:center; }
    .splash-bubble {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      border-radius: 50% 50% 50% 20%;
      display: flex; align-items:center; justify-content:center;
      box-shadow: 0 0 30px rgba(0,212,255,0.5), 0 0 60px rgba(124,58,237,0.3);
      animation: bubble-float 2.4s ease-in-out infinite;
      position: relative; z-index:2;
    }
    .splash-bubble i { font-size: 28px; color: #fff; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); margin-left: 3px; }
    @keyframes bubble-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .splash-rings { position: absolute; top:50%; left:50%; pointer-events:none; width: 100px; height: 100px; margin-top:-50px; margin-left:-50px; }
    .splash-ring { position: absolute; border-radius:50%; border:2px solid transparent; top:50%; left:50%; animation: ring-spin 3s linear infinite; }
    .splash-ring:nth-child(1) { width:100px; height:100px; margin-top:-50px; margin-left:-50px; border-top-color:#00d4ff; border-right-color:rgba(0,212,255,0.3); animation-duration:2.2s; }
    .splash-ring:nth-child(2) { width:85px; height:85px; margin-top:-42px; margin-left:-42px; border-bottom-color:#7c3aed; border-left-color:rgba(124,58,237,0.3); animation-duration:2.8s; animation-direction:reverse; }
    .splash-ring:nth-child(3) { width:70px; height:70px; margin-top:-35px; margin-left:-35px; border-top-color:#00d4ff; border-left-color:rgba(124,58,237,0.4); animation-duration:3.6s; }
    @keyframes ring-spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .splash-particles { position:absolute; width:120px; height:120px; animation: particles-rotate 10s linear infinite; top:50%; left:50%; margin-top:-60px; margin-left:-60px; pointer-events:none; }
    .splash-particles::before, .splash-particles::after { content:''; position:absolute; width:5px; height:5px; border-radius:50%; box-shadow:0 0 10px currentColor; }
    .splash-particles::before { top:0; left:50%; margin-left:-2px; background:#00d4ff; color:#00d4ff; }
    .splash-particles::after { bottom:0; left:50%; margin-left:-2px; background:#7c3aed; color:#7c3aed; }
    @keyframes particles-rotate { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .splash-title {
      font-family: 'Exo 2', sans-serif; font-size: 2.2rem; font-weight: 700;
      background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: 3px; filter: drop-shadow(0 0 18px rgba(0,212,255,0.6));
      animation: title-pulse 2.2s ease-in-out infinite alternate; margin-top: 6px;
    }
    @keyframes title-pulse { from { filter: drop-shadow(0 0 8px rgba(0,212,255,0.5)); } to { filter: drop-shadow(0 0 22px rgba(124,58,237,0.8)); } }
    .splash-sub { font-size: 0.7rem; color:#b0c4de; letter-spacing:3px; text-transform:uppercase; opacity:0.8; animation: fade-sub 2s ease-in-out infinite alternate; }
    @keyframes fade-sub { 0%{opacity:0.4;} 100%{opacity:1;} }

    /* ═════════════ AUTH/APP ═════════════ */
    .auth-mini-logo { width: 50px; height:50px; margin:0 auto 12px; background:linear-gradient(135deg,#00d4ff,#7c3aed); border-radius:14px; display:flex; align-items:center; justify-content:center; animation: bubble-float 2s ease-in-out infinite; }
    .auth-mini-logo i { font-size:20px; color:#fff; }
    #auth-screen { position:fixed; inset:0; z-index:100; background:var(--bg-primary); display:none; flex-direction:column; align-items:center; justify-content:center; padding:16px; overflow-y:auto; }
    .auth-logo { text-align:center; margin-bottom:24px; }
    .auth-logo h1 { font-family:'Exo 2',sans-serif; font-size:1.6rem; font-weight:700; background:linear-gradient(135deg,#00d4ff,#7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .auth-logo p { font-size:0.7rem; color:var(--text-muted); margin-top:2px; }
    .auth-card { width:100%; max-width:360px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
    .auth-tabs { display:flex; gap:4px; margin-bottom:20px; background:var(--bg-secondary); border-radius:var(--radius-sm); padding:3px; }
    .auth-tab { flex:1; padding:8px; border:none; background:transparent; color:var(--text-secondary); border-radius:6px; cursor:pointer; font-family:inherit; font-size:0.8rem; font-weight:500; transition:var(--transition); }
    .auth-tab.active { background:var(--accent); color:#000; font-weight:600; }
    .form-group { margin-bottom:12px; }
    .form-group label { display:block; font-size:0.7rem; font-weight:600; color:var(--text-secondary); margin-bottom:4px; letter-spacing:0.5px; text-transform:uppercase; }
    .form-group input {
      width:100%; padding:10px 12px; border-radius:var(--radius-sm);
      background:var(--bg-input); border:1.5px solid var(--border); color:var(--text-primary);
      font-family:inherit; font-size:0.85rem; outline:none; transition:var(--transition);
    }
    .form-group input:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow); }
    .form-group input::placeholder { color:var(--text-muted); }
    
    /* ছোট ক্লোজ বাটন */
    .small-close-btn {
      position:absolute; top:12px; right:12px; width:28px; height:28px;
      border:none; background:var(--bg-tertiary); color:var(--text-secondary);
      border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px;
    }
  </style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo-wrap">
    <div class="splash-rings"><div class="splash-ring"></div><div class="splash-ring"></div><div class="splash-ring"></div></div>
    <div class="splash-particles"></div>
    <div class="splash-bubble"><i class="fas fa-comment-dots"></i></div>
  </div>
  <div class="splash-title">Kotha Bolbo</div>
  <div class="splash-sub">Created by Sayem</div>
</div>

<div id="auth-screen"></div>

<div id="app">
  <div class="screen active" id="chat-screen">
    <div class="app-header" style="height:52px;background:#111827;border-bottom:1px solid rgba(0,212,255,0.12);display:flex;align-items:center;padding:0 12px;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,0.3);">
      <img id="my-avatar" src="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #00d4ff;flex-shrink:0;cursor:pointer;" onclick="switchTab('settings')" />
      <div style="flex:1;min-width:0;cursor:pointer;"><h2 style="font-size:0.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Kotha Bolbo</h2><span id="my-name-header" style="font-size:0.7rem;color:#8899bb;"></span></div>
    </div>
    <div style="padding:8px 12px;background:#111827;border-bottom:1px solid rgba(0,212,255,0.12);"><div style="display:flex;align-items:center;gap:8px;background:#1e2d44;border-radius:999px;padding:8px 12px;border:1px solid rgba(0,212,255,0.12);"><i class="fas fa-search" style="color:#4a5a78;font-size:13px;"></i><input type="text" id="chat-search" placeholder="Search chats…" oninput="filterChats(this.value)" style="flex:1;border:none;background:transparent;color:#e8f0fe;font-family:inherit;font-size:0.8rem;outline:none;" /></div></div>
    <div class="scroll-area" id="chat-list-container" style="flex:1;overflow-y:auto;"><div class="empty-state" id="chat-empty" style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;padding:32px;"><i class="fas fa-comments" style="font-size:42px;color:#4a5a78;"></i><h3 style="font-size:1rem;font-weight:600;color:#8899bb;">No Chats Yet</h3><p style="font-size:0.75rem;color:#4a5a78;text-align:center;">Go to Friends tab to start chatting!</p></div></div>
  </div>
  <div class="screen" id="friends-screen">
    <div class="app-header" style="height:52px;background:#111827;border-bottom:1px solid rgba(0,212,255,0.12);display:flex;align-items:center;padding:0 12px;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,0.3);"><div style="flex:1;min-width:0;"><h2 style="font-size:0.95rem;font-weight:600;">Friends</h2><span style="font-size:0.7rem;color:#8899bb;">Find people to chat</span></div><button onclick="loadFriends()" style="width:32px;height:32px;border:none;background:transparent;color:#8899bb;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;"><i class="fas fa-sync-alt" id="friends-refresh-icon"></i></button></div>
    <div style="padding:8px 12px;background:#111827;border-bottom:1px solid rgba(0,212,255,0.12);"><div style="display:flex;align-items:center;gap:8px;background:#1e2d44;border-radius:999px;padding:8px 12px;border:1px solid rgba(0,212,255,0.12);"><i class="fas fa-search" style="color:#4a5a78;font-size:13px;"></i><input type="text" id="friends-search" placeholder="Search by name or phone…" oninput="filterFriends(this.value)" style="flex:1;border:none;background:transparent;color:#e8f0fe;font-family:inherit;font-size:0.8rem;outline:none;" /></div></div>
    <div class="scroll-area" id="friends-list-container" style="flex:1;overflow-y:auto;"><div class="empty-state" style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;padding:32px;"><i class="fas fa-user-friends" style="font-size:42px;color:#4a5a78;"></i><h3 style="font-size:1rem;font-weight:600;color:#8899bb;">Loading…</h3></div></div>
  </div>
  <nav style="height:56px;background:#111827;border-top:1px solid rgba(0,212,255,0.12);display:flex;align-items:center;justify-content:space-around;box-shadow:0 -4px 16px rgba(0,0,0,0.4);flex-shrink:0;">
    <button class="nav-btn active" id="nav-chat" onclick="switchTab('chat')" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:#00d4ff;cursor:pointer;padding:6px 0;position:relative;"><i class="fas fa-comment-dots" style="font-size:18px;"></i><span style="font-size:0.65rem;font-weight:500;">Chats</span><span class="badge" id="chat-badge" style="display:none;position:absolute;top:4px;right:calc(50% - 12px);background:#ff4d6d;color:#fff;font-size:0.6rem;font-weight:700;border-radius:999px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px;">0</span></button>
    <button class="nav-btn" id="nav-friends" onclick="switchTab('friends')" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:#4a5a78;cursor:pointer;padding:6px 0;position:relative;"><i class="fas fa-users" style="font-size:18px;"></i><span style="font-size:0.65rem;font-weight:500;">Friends</span></button>
    <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:#4a5a78;cursor:pointer;padding:6px 0;position:relative;"><i class="fas fa-cog" style="font-size:18px;"></i><span style="font-size:0.65rem;font-weight:500;">Settings</span></button>
  </nav>
</div>

<!-- GENDER SELECT MODAL -->
<div class="modal-backdrop" id="gender-modal" style="position:fixed;inset:0;z-index:350;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;">
  <div style="background:#151e30;border-radius:14px;border:1px solid rgba(0,212,255,0.12);width:100%;max-width:340px;padding:20px;max-height:80vh;overflow-y:auto;position:relative;">
    <button class="small-close-btn" onclick="closeModal('gender-modal')"><i class="fas fa-times"></i></button>
    <h2 style="font-size:1rem;font-weight:700;margin-bottom:16px;text-align:center;">Select Gender</h2>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button onclick="selectGender('Male')" style="padding:12px;background:#1e2d44;border:1.5px solid rgba(0,212,255,0.12);border-radius:8px;color:#e8f0fe;font-family:inherit;font-size:0.9rem;cursor:pointer;text-align:left;transition:0.25s;">👨 Male</button>
      <button onclick="selectGender('Female')" style="padding:12px;background:#1e2d44;border:1.5px solid rgba(0,212,255,0.12);border-radius:8px;color:#e8f0fe;font-family:inherit;font-size:0.9rem;cursor:pointer;text-align:left;transition:0.25s;">👩 Female</button>
      <button onclick="selectGender('Other')" style="padding:12px;background:#1e2d44;border:1.5px solid rgba(0,212,255,0.12);border-radius:8px;color:#e8f0fe;font-family:inherit;font-size:0.9rem;cursor:pointer;text-align:left;transition:0.25s;">🌈 Other</button>
    </div>
  </div>
</div>

<div id="toast" style="position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2235;border:1px solid rgba(0,212,255,0.12);color:#e8f0fe;padding:10px 18px;border-radius:999px;font-size:0.8rem;z-index:9998;opacity:0;transition:all 0.3s ease;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,0.4);pointer-events:none;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, query, orderBy, onSnapshot, updateDoc, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getDatabase, ref, set, onValue, onDisconnect, serverTimestamp as rtdbTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBa2bIHkBNK_oajNeFxgKpz4VrIx1aR5Fo",
  authDomain: "kotha-bolbo-aso.firebaseapp.com",
  projectId: "kotha-bolbo-aso",
  storageBucket: "kotha-bolbo-aso.firebasestorage.app",
  messagingSenderId: "343828860232",
  appId: "1:343828860232:web:b566c74f630f8a2532b77d",
  databaseURL: "https://kotha-bolbo-aso-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rtdb = getDatabase(app);

let currentUser = null, currentUserData = null, openChatUser = null;
let msgUnsubscribe = null, chatUnsubscribe = null, presenceUnsubscribe = null, typingUnsubscribe = null;
let typingTimeout = null, typingDebounce = null;
let allFriends = [], allChats = [], unreadCounts = {};
let selectedGender = '';

// গ্লোবাল জেন্ডার সিলেক্ট
window.selectGender = function(gender) {
  selectedGender = gender;
  document.getElementById('gender-display').textContent = gender;
  document.getElementById('gender-display').style.color = '#e8f0fe';
  closeModal('gender-modal');
};

function avatarUrl(name, gender) {
  const seed = encodeURIComponent(name || 'User');
  if (gender === 'Female') return `https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}&gender=female`;
  if (gender === 'Male') return `https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}&gender=male`;
  return `https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}`;
}

setTimeout(() => { document.getElementById('splash').classList.add('hide'); setTimeout(() => { document.getElementById('splash').style.display='none'; initAuth(); }, 800); }, 3000);

function initAuth() {
  onAuthStateChanged(auth, (user) => {
    if (user) { currentUser = user; fetchMyData(); }
    else { currentUserData = null; currentUser = null; showAuthScreen(); }
  });
}

async function fetchMyData() {
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    if (snap.exists()) { currentUserData = snap.data(); }
    else { currentUserData = { displayName: currentUser.email?.split('@')[0]||'User', email: currentUser.email, photoURL: avatarUrl('User',''), gender: '' }; }
  } catch(e) { currentUserData = { displayName: 'User', email: currentUser.email, photoURL: avatarUrl('User',''), gender: '' }; }
  updateUI(); showApp();
}

function updateUI() {
  if (!currentUserData) return;
  const av = currentUserData.photoURL || avatarUrl(currentUserData.displayName||'U', '');
  document.getElementById('my-avatar').src = av;
  document.getElementById('my-name-header').textContent = currentUserData.displayName||'User';
}

function showAuthScreen() {
  document.getElementById('auth-screen').innerHTML = `
    <div class="auth-logo"><div class="auth-mini-logo"><i class="fas fa-comment-dots"></i></div><h1>Kotha Bolbo</h1><p>Talk, stay connected</p></div>
    <div class="auth-card">
      <div class="auth-tabs"><button class="auth-tab active" onclick="switchAuthTab('login')">Login</button><button class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</button></div>
      <div id="login-form">
        <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="your@email.com" /></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••" /></div>
        <button class="btn-primary" onclick="handleLogin()" style="width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000;font-family:inherit;font-size:0.9rem;font-weight:700;cursor:pointer;">Login</button>
      </div>
      <div id="signup-form" style="display:none;">
        <div class="form-group"><label>Full Name</label><input type="text" id="signup-name" placeholder="Your name" /></div>
        <div class="form-group"><label>Phone Number</label><input type="tel" id="signup-phone" placeholder="+880..." /></div>
        <div class="form-group"><label>Email</label><input type="email" id="signup-email" placeholder="your@email.com" /></div>
        <div class="form-group"><label>Gender</label>
          <div id="gender-display" onclick="openGenderModal()" style="width:100%;padding:10px 12px;border-radius:8px;background:#1e2d44;border:1.5px solid rgba(0,212,255,0.12);color:#4a5a78;font-family:inherit;font-size:0.85rem;cursor:pointer;">Select Gender</div>
        </div>
        <div class="form-group"><label>Password</label><input type="password" id="signup-pass" placeholder="Min 6 characters" /></div>
        <button class="btn-primary" onclick="handleSignup()" style="width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000;font-family:inherit;font-size:0.9rem;font-weight:700;cursor:pointer;">Create Account</button>
      </div>
      <div class="auth-error" id="auth-error" style="font-size:0.75rem;color:#ff6b6b;text-align:center;margin-top:10px;min-height:16px;"></div>
    </div>`;
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('app').classList.remove('visible');
}

function setOnlineStatus() {
  if (!currentUser) return;
  const onlineRef = ref(rtdb, `status/${currentUser.uid}`);
  onValue(ref(rtdb, '.info/connected'), (snap) => {
    if (snap.val() === true) {
      set(onlineRef, { online: true, lastSeen: rtdbTimestamp() });
      onDisconnect(onlineRef).set({ online: false, lastSeen: rtdbTimestamp() });
    }
  });
}

function showApp() {
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('app').style.display='flex';
  document.getElementById('app').style.flexDirection='column';
  document.getElementById('app').style.height='100%';
  if (currentUser) setOnlineStatus();
  loadChats(); loadFriends();
}

window.openGenderModal = function() {
  document.getElementById('gender-modal').style.display='flex';
};

window.switchAuthTab = function(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='signup')));
  document.getElementById('login-form').style.display = tab==='login'?'block':'none';
  document.getElementById('signup-form').style.display = tab==='signup'?'block':'none';
  document.getElementById('auth-error').textContent = '';
};

window.handleLogin = async function() {
  const email = document.getElementById('login-email').value.trim(), pass = document.getElementById('login-pass').value;
  if (!email||!pass) { document.getElementById('auth-error').textContent='Please fill all fields'; return; }
  const btn = document.querySelector('#login-form .btn-primary'); btn.disabled=true; btn.textContent='Logging in…';
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch(e) { document.getElementById('auth-error').textContent = e.code==='auth/user-not-found'?'No account found':e.code==='auth/wrong-password'?'Incorrect password':e.code==='auth/invalid-email'?'Invalid email':'Something went wrong'; btn.disabled=false; btn.textContent='Login'; }
};

window.handleSignup = async function() {
  const name = document.getElementById('signup-name').value.trim(), phone = document.getElementById('signup-phone').value.trim();
  const email = document.getElementById('signup-email').value.trim(), pass = document.getElementById('signup-pass').value;
  if (!name||!email||!pass) { document.getElementById('auth-error').textContent='Please fill required fields'; return; }
  if (pass.length<6) { document.getElementById('auth-error').textContent='Password min 6 characters'; return; }
  const btn = document.querySelector('#signup-form .btn-primary'); btn.disabled=true; btn.textContent='Creating…';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, 'users', cred.user.uid), { uid:cred.user.uid, displayName:name, phone:phone||'', email:email, gender:selectedGender||'', photoURL:avatarUrl(name,selectedGender), createdAt:serverTimestamp(), online:true });
  } catch(e) { document.getElementById('auth-error').textContent = e.code==='auth/email-already-in-use'?'Email already in use':'Something went wrong'; btn.disabled=false; btn.textContent='Create Account'; }
};

window.switchTab = function(tab) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>{b.style.color='#4a5a78';b.classList.remove('active');});
  document.getElementById(tab+'-screen').classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).style.color='#00d4ff';
  if (tab==='friends') loadFriends();
};

async function loadChats() {
  if (!currentUser) return;
  if (chatUnsubscribe) chatUnsubscribe();
  const q = query(collection(db, 'messages'), orderBy('timestamp','desc'));
  chatUnsubscribe = onSnapshot(q, async (snap) => {
    const seen=new Set(), chatMap={}, counts={};
    snap.forEach(d=>{
      const msg=d.data();
      if (msg.senderId!==currentUser.uid && msg.receiverId!==currentUser.uid) return;
      const oid=msg.senderId===currentUser.uid?msg.receiverId:msg.senderId;
      if (!seen.has(oid)) { seen.add(oid); chatMap[oid]=msg; }
      if (msg.senderId!==currentUser.uid && msg.receiverId===currentUser.uid && !msg.read) counts[oid]=(counts[oid]||0)+1;
    });
    unreadCounts=counts;
    const cu=[];
    for(const uid of Object.keys(chatMap)) {
      try {
        const u=await getDoc(doc(db,'users',uid));
        if(u.exists()) {
          const userData=u.data();
          try { const oSnap = await new Promise(r=>onValue(ref(rtdb,`status/${uid}`),s=>r(s.val()),{onlyOnce:true})); userData.online = oSnap?.online || false; } catch(e) { userData.online = false; }
          cu.push({user:userData,lastMsg:chatMap[uid]});
        }
      } catch(e) {}
    }
    cu.sort((a,b)=>{ const uA=unreadCounts[a.user.uid]||0,uB=unreadCounts[b.user.uid]||0; if(uA&&!uB) return -1; if(uB&&!uA) return 1; return (b.lastMsg.timestamp?.seconds||0)-(a.lastMsg.timestamp?.seconds||0); });
    allChats=cu; renderChatList(cu); updateBadge();
  });
}

function updateBadge() { const t=Object.values(unreadCounts).reduce((a,b)=>a+b,0); const b=document.getElementById('chat-badge'); if(t>0) { b.style.display='flex'; b.textContent=t>99?'99+':t; } else b.style.display='none'; }

function renderChatList(chats) {
  const c=document.getElementById('chat-list-container'), e=document.getElementById('chat-empty');
  c.querySelectorAll('.chat-list-item').forEach(x=>x.remove());
  if (!chats.length) { e.style.display='flex'; return; }
  e.style.display='none';
  chats.forEach(({user,lastMsg})=>{
    const div=document.createElement('div'), ur=unreadCounts[user.uid]||0;
    div.className='chat-list-item'+(ur>0?' unread':'');
    div.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid rgba(0,212,255,0.12);';
    div.onclick=()=>openConversation(user);
    const ts=lastMsg.timestamp?new Date(lastMsg.timestamp.seconds*1000):new Date();
    div.innerHTML=`<div style="position:relative;flex-shrink:0;"><img src="${user.photoURL||avatarUrl(user.displayName||'U',user.gender)}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid rgba(0,212,255,0.12);" /><div style="position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:${user.online?'#4ade80':'#4a5a78'};border:2px solid #111827;"></div></div><div style="flex:1;min-width:0;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;"><span style="font-size:0.9rem;font-weight:600;">${user.displayName||'User'}</span><span style="font-size:0.65rem;color:#4a5a78;">${formatTime(ts)}</span></div><div style="font-size:0.75rem;color:#8899bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${lastMsg.senderId===currentUser.uid?'You: ':''}${lastMsg.text||''}</div></div>${ur>0?`<span style="background:#ff4d6d;color:#fff;font-size:0.65rem;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;">${ur}</span>`:''}`;
    c.appendChild(div);
  });
}

window.filterChats = function(q) { renderChatList(allChats.filter(({user})=>(user.displayName||'').toLowerCase().includes(q.toLowerCase()))); };

window.loadFriends = async function() {
  const icon=document.getElementById('friends-refresh-icon'); icon.classList.add('spinner');
  try { const snap=await getDocs(collection(db,'users')); allFriends=[]; snap.forEach(d=>{if(d.id!==currentUser?.uid) allFriends.push(d.data());}); renderFriends(allFriends); }
  catch(e) { showToast('Error loading','error'); }
  icon.classList.remove('spinner');
};

function renderFriends(friends) {
  const c=document.getElementById('friends-list-container'); c.innerHTML='';
  if (!friends.length) { c.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;padding:32px;"><i class="fas fa-user-slash" style="font-size:42px;color:#4a5a78;"></i><h3 style="font-size:1rem;font-weight:600;color:#8899bb;">No Users Found</h3></div>'; return; }
  friends.forEach(user=>{
    const div=document.createElement('div');
    div.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid rgba(0,212,255,0.12);';
    const emailPrefix = user.email ? user.email.substring(0,6)+'...' : '';
    div.innerHTML = `<img src="${user.photoURL||avatarUrl(user.displayName||'U',user.gender)}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid rgba(0,212,255,0.12);flex-shrink:0;" /><div style="flex:1;min-width:0;"><div style="font-size:0.9rem;font-weight:600;">${user.displayName||'User'}</div>${emailPrefix?`<small style="font-size:0.7rem;color:#4a5a78;">${emailPrefix}</small>`:''}</div><div style="width:36px;height:36px;border-radius:50%;border:none;background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;"><i class="fas fa-comment"></i></div>`;
    div.querySelector('div:last-child').onclick=e=>{e.stopPropagation();openConversation(user);};
    div.onclick=()=>openConversation(user);
    c.appendChild(div);
  });
}

window.filterFriends = function(q) { const ql=q.toLowerCase().trim(); if(!ql) { renderFriends(allFriends); return; } renderFriends(allFriends.filter(u=>(u.displayName||'').toLowerCase().includes(ql)||(u.phone||'').toLowerCase().includes(ql))); };

window.openConversation = function(user) {
  closeConversation();
  openChatUser = user;
  document.getElementById('app').style.display='none';
  const convScreen = document.createElement('div');
  convScreen.id='conv-screen';
  convScreen.style.cssText='position:fixed;inset:0;z-index:50;background:#0a0e1a;display:flex;flex-direction:column;';
  convScreen.innerHTML = `
    <div style="height:52px;background:#111827;border-bottom:1px solid rgba(0,212,255,0.12);display:flex;align-items:center;padding:0 12px;gap:10px;">
      <button onclick="closeConversation()" style="width:30px;height:30px;border:none;background:transparent;color:#00d4ff;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;"><i class="fas fa-arrow-left"></i></button>
      <div style="position:relative;flex-shrink:0;"><img id="conv-avatar" src="${user.photoURL||avatarUrl(user.displayName||'U',user.gender)}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid #00d4ff;" /><div class="conv-status-dot" style="position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:#4a5a78;border:2px solid #111827;"></div></div>
      <div style="flex:1;min-width:0;"><h2 style="font-size:0.95rem;font-weight:600;">${user.displayName||'User'}</h2><span class="conv-status-text" style="font-size:0.7rem;color:#8899bb;">Offline</span></div>
    </div>
    <div class="conv-messages" id="conv-messages" style="flex:1;overflow-y:auto;padding:12px 8px;display:flex;flex-direction:column;gap:4px;"></div>
    <div id="typing-row" style="padding:0 8px 6px;display:none;"><div style="display:flex;align-items:center;gap:6px;"><img src="${user.photoURL||avatarUrl(user.displayName||'U',user.gender)}" style="width:24px;height:24px;border-radius:50%;" /><div style="display:flex;align-items:center;gap:3px;padding:8px 12px;background:#1e2d44;border-radius:16px;border:1px solid rgba(0,212,255,0.12);"><div class="typing-dot" style="width:5px;height:5px;border-radius:50%;background:#8899bb;animation:typing 1.2s ease infinite;"></div><div class="typing-dot" style="width:5px;height:5px;border-radius:50%;background:#8899bb;animation:typing 1.2s ease infinite;animation-delay:0.2s;"></div><div class="typing-dot" style="width:5px;height:5px;border-radius:50%;background:#8899bb;animation:typing 1.2s ease infinite;animation-delay:0.4s;"></div></div></div></div>
    <div style="display:flex;align-items:flex-end;gap:8px;padding:8px 10px;background:#111827;border-top:1px solid rgba(0,212,255,0.12);">
      <div style="flex:1;background:#1e2d44;border-radius:999px;border:1.5px solid rgba(0,212,255,0.12);display:flex;align-items:center;padding:0 12px;"><textarea id="msg-input" rows="1" placeholder="Type a message…" oninput="autoResize(this);" onkeydown="msgKeyDown(event)" style="flex:1;border:none;background:transparent;color:#e8f0fe;font-family:inherit;font-size:0.85rem;outline:none;resize:none;padding:10px 0;max-height:80px;"></textarea></div>
      <button onclick="sendMessage()" style="width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,#00d4ff,#0099cc);color:#000;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;"><i class="fas fa-paper-plane"></i></button>
    </div>`;
  document.body.appendChild(convScreen);
  listenPresence(user.uid);
  listenTyping(user.uid);
  subscribeMessages();
  markRead(user.uid);
};

window.closeConversation = function() {
  if (openChatUser && currentUser) {
    set(ref(rtdb, `typing/${currentUser.uid}_${openChatUser.uid}`), { typing: false });
  }
  const conv = document.getElementById('conv-screen');
  if (conv) conv.remove();
  if(msgUnsubscribe){msgUnsubscribe();msgUnsubscribe=null;}
  if(presenceUnsubscribe){presenceUnsubscribe();presenceUnsubscribe=null;}
  if(typingUnsubscribe){typingUnsubscribe();typingUnsubscribe=null;}
  clearTimeout(typingTimeout); clearTimeout(typingDebounce);
  openChatUser=null;
  document.getElementById('app').style.display='flex';
};

function listenPresence(uid) {
  if (presenceUnsubscribe) presenceUnsubscribe();
  presenceUnsubscribe = onValue(ref(rtdb, `status/${uid}`), (snap) => {
    const data = snap.val();
    const dot = document.querySelector('.conv-status-dot');
    const text = document.querySelector('.conv-status-text');
    if (dot && text && data) {
      if (data.online) { dot.style.background='#4ade80'; text.innerHTML='<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;margin-right:4px;vertical-align:middle;"></span>Online'; }
      else { dot.style.background='#4a5a78'; text.textContent='Offline'; }
    }
  });
}

function listenTyping(uid) {
  if (typingUnsubscribe) typingUnsubscribe();
  typingUnsubscribe = onValue(ref(rtdb, `typing/${uid}_${currentUser.uid}`), (snap) => {
    const data = snap.val(), tr = document.getElementById('typing-row');
    if (tr) {
      if (data && data.typing === true) { tr.style.display='block'; clearTimeout(typingTimeout); typingTimeout=setTimeout(()=>{if(tr)tr.style.display='none';},3000); }
      else { tr.style.display='none'; }
    }
  });
}

async function markRead(sid) {
  if(!currentUser||!sid) return;
  const q=query(collection(db,'messages'),where('senderId','==',sid),where('receiverId','==',currentUser.uid),where('read','==',false));
  const snap=await getDocs(q);
  snap.forEach(async d=>{await updateDoc(doc(db,'messages',d.id),{read:true,seen:true});});
}

function subscribeMessages() {
  if(msgUnsubscribe) msgUnsubscribe();
  if(!currentUser||!openChatUser) return;
  msgUnsubscribe=onSnapshot(query(collection(db,'messages'),orderBy('timestamp','asc')),snap=>{
    const msgs=[];
    snap.forEach(d=>{
      const m=d.data();
      if((m.senderId===currentUser.uid&&m.receiverId===openChatUser.uid)||(m.senderId===openChatUser.uid&&m.receiverId===currentUser.uid)) msgs.push({...m,id:d.id});
    });
    renderMessages(msgs);
    if(openChatUser) markRead(openChatUser.uid);
  });
}

function renderMessages(msgs) {
  const c=document.getElementById('conv-messages');
  if(!c) return;
  c.innerHTML=''; let ld='';
  msgs.forEach(m=>{
    const ts=m.timestamp?new Date(m.timestamp.seconds*1000):new Date();
    const ds=ts.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    if(ds!==ld){const d=document.createElement('div');d.className='date-divider';d.textContent=ds;d.style.cssText='text-align:center;font-size:0.6rem;color:#4a5a78;margin:6px 0;padding:2px 10px;background:#1a2235;border-radius:999px;width:fit-content;align-self:center;';c.appendChild(d);ld=ds;}
    const isSent=m.senderId===currentUser.uid;
    const row=document.createElement('div');
    row.style.cssText=`display:flex;align-items:flex-end;gap:6px;${isSent?'flex-direction:row-reverse;':''}`;
    let sh='';
    if(isSent){if(m.seen)sh='<span class="msg-status seen" style="color:#00d4ff;margin-left:3px;"><i class="fas fa-check-double"></i></span>';else if(m.delivered)sh='<span class="msg-status delivered" style="color:#8899bb;margin-left:3px;"><i class="fas fa-check-double"></i></span>';else sh='<span class="msg-status sent-status" style="color:#4a5a78;margin-left:3px;"><i class="fas fa-check"></i></span>';}
    row.innerHTML=`${!isSent?`<img src="${openChatUser?.photoURL||avatarUrl(openChatUser?.displayName||'U',openChatUser?.gender)}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;" />`:''}<div style="max-width:75%;padding:8px 12px;border-radius:16px;font-size:0.8rem;line-height:1.4;word-break:break-word;${isSent?'background:linear-gradient(135deg,#00d4ff 0%,#0099cc 100%);color:#000;font-weight:500;border-bottom-right-radius:4px;':'background:#1e2d44;color:#e8f0fe;border:1px solid rgba(0,212,255,0.12);border-bottom-left-radius:4px;'}">${m.text}<span style="font-size:0.6rem;margin-top:3px;display:block;text-align:right;${isSent?'color:rgba(0,0,0,0.5);':'color:#4a5a78;'}">${formatTime(ts)} ${sh}</span></div>`;
    c.appendChild(row);
  });
  c.scrollTop=c.scrollHeight;
}

window.sendMessage = async function() {
  const input=document.getElementById('msg-input');
  if(!input) return;
  const text=input.value.trim();
  if(!text||!currentUser||!openChatUser) return;
  input.value=''; autoResize(input);
  set(ref(rtdb, `typing/${currentUser.uid}_${openChatUser.uid}`), { typing: false });
  try { await addDoc(collection(db,'messages'),{senderId:currentUser.uid,receiverId:openChatUser.uid,text,timestamp:serverTimestamp(),delivered:false,read:false,seen:false}); }
  catch(e) { showToast('Send failed','error'); }
};

window.msgKeyDown = function(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} };

window.closeModal = function(id) { 
  const modal = document.getElementById(id);
  if (modal) modal.style.display='none';
};

window.showToast = function(msg,type) {
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.opacity='1';
  t.style.transform='translateX(-50%) translateY(0)';
  if (type==='error') t.style.borderColor='#ff4d6d', t.style.color='#ff4d6d';
  else t.style.borderColor='rgba(0,212,255,0.12)', t.style.color='#e8f0fe';
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)';},2500);
};

window.autoResize = function(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,80)+'px'; };

function formatTime(d) {
  const n=new Date();
  if(d.toDateString()===n.toDateString()) return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
  const diff=Math.floor((n-d)/86400000);
  if(diff<7) return d.toLocaleDateString('en-US',{weekday:'short'});
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

// Modal backdrop ক্লোজ
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('modal-backdrop')) e.target.style.display='none';
});
</script>
